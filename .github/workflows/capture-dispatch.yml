name: Capture and deliver

on:
  repository_dispatch:
    types: [capture-site]

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright sharp @supabase/supabase-js
          npx playwright install --with-deps chromium

      - name: Capture
        run: node capture.js 2>&1 | tee capture.log
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}

      - name: Upload to Supabase and notify the app
        run: node scripts/deliver-capture.js
        env:
          TARGET_ID: ${{ github.event.client_payload.target_id }}
          TARGET_TYPE: ${{ github.event.client_payload.target_type }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}

      # After delivery, so a failure reading the palette can never cost the
      # screenshots. Sites only -- a component source is a page we crop, not a
      # design whose palette belongs in the library.
      - name: Analyze style
        if: github.event.client_payload.target_type != 'component_source'
        continue-on-error: true
        run: node analyze.js
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
          TARGET_ID: ${{ github.event.client_payload.target_id }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
