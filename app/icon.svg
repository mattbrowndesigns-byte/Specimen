<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ember: the capture bar's ramp as an orb rather than a line. Blurred
       blobs instead of a linear or radial gradient, so the blend reads as
       organic. Colours are the light-mode ramp stops in globals.css
       (deep, mid, warm, lit). A double hyphen is illegal inside an XML
       comment, so the token names can't be written out here. -->
  <defs>
    <clipPath id="orb"><circle cx="50" cy="50" r="50"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <g clip-path="url(#orb)">
    <rect width="100" height="100" fill="#2b1b3d"/>
    <g filter="url(#soft)">
      <circle cx="28" cy="28" r="42" fill="#7b4bd8"/>
      <circle cx="72" cy="74" r="38" fill="#e8502e"/>
      <circle cx="80" cy="84" r="20" fill="#ff9153"/>
    </g>
  </g>
</svg>
